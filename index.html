<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3d5a40"><title>Carnet de terrain</title>
<style>
:root{--bg:#e9ecdf;--card:#f7f8f1;--ink:#26301f;--mut:#667058;--pri:#3d5a40;--pri2:#2b4230;--ok:#4f8a3a;--ko:#b5443a;--line:#cdd3bd}
:root.dk{--bg:#171c15;--card:#222a1f;--ink:#e6ead9;--mut:#9aa68a;--pri:#7fae6a;--pri2:#5f8a4d;--ok:#7fc15f;--ko:#e0776b;--line:#364030}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);padding-bottom:76px}
main{max-width:560px;margin:auto;padding:18px 16px}
h1{font-size:26px;margin:4px 0 14px}h2{font-size:18px;margin:20px 0 8px}
.t{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px;margin:8px 0;width:100%;text-align:left;color:var(--ink);font-size:16px}
.t b{display:block}.t small,.mut{color:var(--mut)}.e{font-size:30px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.btn{display:block;width:100%;background:var(--pri);color:#fff;border:0;border-bottom:4px solid var(--pri2);border-radius:14px;padding:14px;font-size:17px;font-weight:700;margin:10px 0}
:root.dk .btn{color:#0f160d}.btn:disabled{opacity:.4}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--line)}
nav button{flex:1;padding:12px 0 14px;background:none;border:0;color:var(--mut);font-size:13px}nav button.on{color:var(--pri);font-weight:700}nav span{display:block;font-size:22px}
.o{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;margin:8px 0;padding:10px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;color:var(--ink);font-size:16px;text-align:left}
.o.s{border-color:var(--pri);background:var(--bg)}.o.ok{border-color:var(--ok)}.o.ko{border-color:var(--ko)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .o{min-height:120px}
img{max-width:100%;max-height:150px;border-radius:10px;object-fit:cover}.v{text-align:center;margin:10px 0}.fl{font-size:70px;display:block}
.pg{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}.pg i{display:block;height:100%;background:var(--pri);transition:width .3s}
.bn{padding:12px;border-radius:12px;margin:8px 0;font-size:15px}.bn.ok{background:var(--ok);color:#fff}.bn.ko{background:var(--ko);color:#fff}
.q{font-size:20px;font-weight:700;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
textarea,input[type=file]{width:100%;padding:8px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px}a{color:var(--pri)}
</style></head><body><main id="app"></main>
<nav><button data-v="home"><span>🌿</span>Apprendre</button><button data-v="fiches"><span>📖</span>Fiches</button><button data-v="set"><span>⚙️</span>Paramètres</button></nav>
<script>
// Données: [nom, titre Wikipédia FR, phrase (contient le nom), emoji optionnel]. Sources à vérifier: LPO, WMO Cloud Atlas, ONF, Wikipédia, BRGM.
const D=[
{id:"rap",n:"Rapaces de France",e:"🦅",c:[
["Buse variable","Buse variable","La Buse variable est le rapace diurne le plus commun de France, souvent perché sur un poteau."],
["Faucon crécerelle","Faucon crécerelle","Le Faucon crécerelle pratique le vol sur place pour repérer les campagnols."],
["Épervier d'Europe","Épervier d'Europe","L'Épervier d'Europe chasse les petits oiseaux en forêt et dans les jardins, grâce à ses ailes courtes."],
["Milan royal","Milan royal","Le Milan royal se reconnaît à sa queue très fourchue et à son plumage roux."],
["Gypaète barbu","Gypaète barbu","Le Gypaète barbu, présent dans les Alpes et les Pyrénées, se nourrit surtout d'os."],
["Aigle royal","Aigle royal","L'Aigle royal est un grand rapace de montagne, à la nuque dorée."],
["Faucon pèlerin","Faucon pèlerin","Le Faucon pèlerin attaque en piqué et dépasse les 300 km/h."],
["Chouette hulotte","Chouette hulotte","La Chouette hulotte est la chouette la plus répandue en forêt, au chant ululé."]]},
{id:"nua",n:"Nuages",e:"☁️",c:[
["Cumulus","Cumulus (nuage)","Le Cumulus est un nuage de beau temps, à base plate et au sommet bourgeonnant."],
["Cirrus","Cirrus (nuage)","Les Cirrus sont des nuages d'altitude filamenteux, composés de cristaux de glace."],
["Stratus","Stratus (nuage)","Le Stratus est une nappe grise basse et uniforme, parfois source de bruine."],
["Cumulonimbus","Cumulonimbus","Le Cumulonimbus est le nuage d'orage, à très grand développement vertical."],
["Altocumulus","Altocumulus","L'Altocumulus forme des banquettes de moutons blancs et gris à moyenne altitude."],
["Nimbostratus","Nimbostratus","Le Nimbostratus est épais et sombre, il donne une pluie ou une neige continue."],
["Stratocumulus","Stratocumulus","Le Stratocumulus forme une couche basse de rouleaux gris et blancs."],
["Cirrostratus","Cirrostratus","Le Cirrostratus est un voile transparent qui provoque un halo autour du Soleil."]]},
{id:"met",n:"Météorologie",e:"🌦️",c:[
["Anticyclone","Anticyclone","Un anticyclone est une zone de hautes pressions, synonyme de temps généralement stable."],
["Dépression","Dépression (météorologie)","Une dépression est une zone de basses pressions, associée au vent et aux perturbations."],
["Front froid","Front froid","Un front froid est la limite où l'air froid remplace l'air chaud, souvent avec des averses."],
["Isobare","Isobare","Une isobare est une ligne reliant les points de même pression sur une carte météo."],
["Point de rosée","Point de rosée","Le point de rosée est la température à laquelle la vapeur d'eau se condense."],
["Échelle de Beaufort","Échelle de Beaufort","L'échelle de Beaufort mesure la force du vent de 0 à 12."],
["Mistral","Mistral (vent)","Le mistral est un vent froid et violent qui souffle dans la vallée du Rhône."],
["Humidité relative","Humidité de l'air","L'humidité relative est le rapport entre la vapeur d'eau présente et la quantité maximale possible."]]},
{id:"arb",n:"Arbres (feuilles)",e:"🌳",c:[
["Chêne pédonculé","Chêne pédonculé","Le chêne pédonculé a des feuilles lobées, presque sans pétiole, et des glands portés par un long pédoncule."],
["Hêtre commun","Hêtre commun","Le hêtre commun a des feuilles ovales, entières, à bord légèrement ondulé et soyeux."],
["Châtaignier","Châtaignier","Le châtaignier a de longues feuilles dentées, aux dents pointues bien marquées."],
["Érable sycomore","Érable sycomore","L'érable sycomore a de grandes feuilles palmées à cinq lobes dentés."],
["Bouleau verruqueux","Bouleau verruqueux","Le bouleau verruqueux a une écorce blanche et des feuilles triangulaires, doublement dentées."],
["Épicéa commun","Épicéa commun","L'épicéa commun porte des aiguilles courtes et piquantes, et des cônes pendants."],
["Sapin blanc","Sapin blanc","Le sapin blanc a des aiguilles plates et deux bandes blanches sous chacune, et des cônes dressés."],
["Frêne commun","Frêne commun","Le frêne commun a des feuilles composées de nombreuses folioles et des bourgeons noirs."]]},
{id:"roc",n:"Roches",e:"🪨",c:[
["Granite","Granite","Le granite est une roche grenue, claire, faite de quartz, feldspath et mica."],
["Basalte","Basalte","Le basalte est une roche volcanique sombre, issue d'une lave refroidie vite."],
["Calcaire","Calcaire","Le calcaire est une roche sédimentaire riche en carbonate de calcium, qui fait effervescence à l'acide."],
["Grès","Grès","Le grès est une roche sédimentaire formée de grains de sable cimentés."],
["Schiste","Schiste","Le schiste se débite en feuillets minces et sombres."],
["Gneiss","Gneiss","Le gneiss est une roche métamorphique à bandes claires et sombres alternées."],
["Marbre","Marbre","Le marbre est un calcaire métamorphisé, utilisé en sculpture."],
["Craie","Craie","La craie est un calcaire blanc, tendre, formé de micro-organismes marins."]]},
{id:"geo",n:"Départements & massifs",e:"🗺️",c:[
["Savoie","Savoie (département)","Chambéry est la préfecture de la Savoie."],
["Haute-Savoie","Haute-Savoie","Annecy est la préfecture de la Haute-Savoie."],
["Isère","Isère (département)","Grenoble est la préfecture de l'Isère."],
["Finistère","Finistère","Quimper est la préfecture du Finistère."],
["Chartreuse","Massif de la Chartreuse","Le massif de la Chartreuse se situe entre Grenoble et Chambéry."],
["Bauges","Massif des Bauges","Le massif des Bauges est un massif préalpin de Savoie et Haute-Savoie."],
["Vercors","Massif du Vercors","Le Vercors est un massif calcaire des Préalpes, dans la Drôme et l'Isère."],
["Mercantour","Massif du Mercantour","Le Mercantour est un massif des Alpes du Sud, aux frontières de l'Italie."]]},
{id:"pay",n:"Pays du monde",e:"🌍",c:[
["Japon","Japon","Tokyo est la capitale du Japon.","🇯🇵"],
["Brésil","Brésil","Brasilia est la capitale du Brésil.","🇧🇷"],
["Canada","Canada","Ottawa est la capitale du Canada.","🇨🇦"],
["Kenya","Kenya","Nairobi est la capitale du Kenya.","🇰🇪"],
["Australie","Australie","Canberra est la capitale de l'Australie.","🇦🇺"],
["Norvège","Norvège","Oslo est la capitale de la Norvège.","🇳🇴"],
["Pérou","Pérou","Lima est la capitale du Pérou.","🇵🇪"],
["Maroc","Maroc","Rabat est la capitale du Maroc.","🇲🇦"]]}];
const $=s=>document.querySelector(s),A=$('#app'),DAY=864e5,IV=[0,1,3,7,16,40];
let S={};try{S=JSON.parse(localStorage.getItem('ct')||'{}')}catch(e){}
S.k=S.k||{};S.off=S.off||[];S.x=S.x||[];if(S.dk===undefined)S.dk=matchMedia('(prefers-color-scheme:dark)').matches;
const save=()=>{try{localStorage.setItem('ct',JSON.stringify(S))}catch(e){}};
const themes=()=>D.concat(S.x),active=()=>themes().filter(t=>!S.off.includes(t.id));
const cards=ts=>ts.flatMap(t=>t.c.map(c=>({id:t.id+':'+c[0],t:t.id,n:c[0],w:c[1],f:c[2],e:c[3]||''})));
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),blank=c=>c.f.replace(new RegExp(esc(c.n),'i'),'_____');
const H=s=>String(s).replace(/[<>&"]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[m]));
const cache={};
async function hydrate(){document.querySelectorAll('img[data-w]').forEach(async i=>{const w=i.dataset.w;try{if(!(w in cache))cache[w]=fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(w)).then(r=>r.json()).then(j=>j.thumbnail&&j.thumbnail.source).catch(()=>null);const u=await cache[w];if(u)i.src=u;else i.remove()}catch(e){i.remove()}})}
const vis=c=>`<div class="v">${c.e?`<span class="fl">${c.e}</span>`:''}${c.w?`<img data-w="${H(c.w)}" alt="">`:''}</div>`;
const mast=c=>(S.k[c.id]||{b:-1}).b;
function view(v){document.documentElement.classList.toggle('dk',!!S.dk);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));({home,fiches,set:settings})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>view(b.dataset.v));
function home(){const ts=active(),all=cards(ts),now=Date.now(),due=all.filter(c=>S.k[c.id]&&S.k[c.id].due<=now).length;
A.innerHTML=`<h1>Carnet de terrain</h1><p class="mut">${due} carte(s) à revoir aujourd'hui · ${all.filter(c=>mast(c)<0).length} nouvelle(s)</p><button class="btn" id="mx" ${all.length?'':'disabled'}>🎲 10 questions mélangées</button><h2>Choisir un thème</h2>`+ts.map(t=>{const cs=cards([t]),m=cs.filter(c=>mast(c)>=4).length;return`<button class="t" data-t="${t.id}"><span class="e">${t.e||'📘'}</span><span style="flex:1"><b>${H(t.n)}</b><small>${m}/${cs.length} maîtrisées</small><div class="bar"><i style="width:${m/cs.length*100}%"></i></div></span></button>`}).join('')||'<p>Aucun thème actif. Active-en un dans les paramètres.</p>';
$('#mx').onclick=()=>start(ts);A.querySelectorAll('.t').forEach(b=>b.onclick=()=>start(ts.filter(t=>t.id==b.dataset.t)))}
let Z;
function start(ts){const all=cards(ts),now=Date.now(),due=sh(all.filter(c=>S.k[c.id]&&S.k[c.id].due<=now)),nw=sh(all.filter(c=>!S.k[c.id])),rest=all.filter(c=>S.k[c.id]&&S.k[c.id].due>now).sort((a,b)=>S.k[a.id].due-S.k[b.id].due);
const q=sh(due.concat(nw,rest).slice(0,10));Z={q,tot:q.length,ok:0,all,sel:null,chk:false};ask()}
function mk(c){const ty=['n2f','f2n'];if(c.w||c.e)ty.push('i2n','i2f');if(c.w)ty.push('n2i');const t=ty[Math.random()*ty.length|0];
let pool=Z.all.filter(x=>x.id!=c.id&&(t!='n2i'||x.w));const same=sh(pool.filter(x=>x.t==c.t));pool=same.concat(sh(pool.filter(x=>x.t!=c.t)));
const o=sh([c].concat(pool.slice(0,3))),im=t=='n2i',tx=t=='n2f'||t=='i2f';
const P={n2f:`Quelle phrase décrit « ${H(c.n)} » ?`,f2n:'Complète la phrase',i2n:"Qu'est-ce que c'est ?",i2f:'Quelle phrase correspond à cette image ?',n2i:`Où est « ${H(c.n)} » ?`}[t];
const S1=t=='f2n'?`<div class="q">${H(blank(c))}</div>`:(t=='i2n'||t=='i2f')?vis(c):'';
return{P,S1,im,g:im,o:o.map(x=>({id:x.id,h:im?(x.e?`<span class="fl" style="font-size:40px">${x.e}</span>`:'')+`<img data-w="${H(x.w)}" alt="">`:H(tx?blank(x):x.n)})),a:c.id}}
function ask(){if(!Z.q.length)return end();const c=Z.q[0],q=Z.cq=mk(c);Z.sel=null;Z.chk=false;
A.innerHTML=`<div class="pg"><i style="width:${(Z.tot-Z.q.length)/Z.tot*100}%"></i></div><div class="q">${q.P}</div>${q.S1}<div class="${q.g?'g2':''}">`+q.o.map(o=>`<button class="o" data-k="${H(o.id)}">${o.h}</button>`).join('')+`</div><div id="bn"></div><button class="btn" id="go" disabled>Vérifier</button><button class="btn g" id="qt">Quitter</button>`;
hydrate();A.querySelectorAll('.o').forEach(b=>b.onclick=()=>{if(Z.chk)return;Z.sel=b.dataset.k;A.querySelectorAll('.o').forEach(x=>x.classList.toggle('s',x==b));$('#go').disabled=false});$('#qt').onclick=()=>view('home');$('#go').onclick=go}
function go(){const c=Z.q[0];if(Z.chk){Z.q.shift();return ask()}Z.chk=true;const ok=Z.sel==c.id;
A.querySelectorAll('.o').forEach(b=>{b.classList.remove('s');if(b.dataset.k==c.id)b.classList.add('ok');else if(b.dataset.k==Z.sel)b.classList.add('ko')});
if(!c.retry){const k=S.k[c.id]||{b:-1};k.b=ok?Math.min(k.b+1,5):0;if(k.b<0)k.b=0;k.due=Date.now()+IV[k.b]*DAY;S.k[c.id]=k;save();if(ok)Z.ok++}
if(!ok&&!c.retry){c.retry=1;Z.q.push(c)}
$('#bn').innerHTML=`<div class="bn ${ok?'ok':'ko'}">${ok?'Bravo !':'Réponse :'} ${H(c.n)}. ${H(c.f)}</div>`;$('#go').textContent='Continuer'}
function end(){A.innerHTML=`<h1>Séance terminée 🌿</h1><p class="q">${Z.ok} / ${Z.tot} réussies du premier coup</p><button class="btn" id="re">Nouvelle séance</button><button class="btn g" id="hm">Accueil</button>`;$('#re').onclick=()=>start(Z.all.length?active().filter(t=>Z.all.some(c=>c.t==t.id)):active());$('#hm').onclick=()=>view('home')}
function fiches(){A.innerHTML='<h1>Fiches</h1>'+active().map(t=>`<h2>${t.e||''} ${H(t.n)}</h2>`+cards([t]).map(c=>`<button class="t" data-i="${H(c.id)}"><b style="flex:1">${H(c.n)}</b><small>${mast(c)<0?'nouveau':'niveau '+mast(c)+'/5'}</small></button>`).join('')).join('');
const all=cards(active());A.querySelectorAll('.t').forEach(b=>b.onclick=()=>{const c=all.find(x=>x.id==b.dataset.i);A.innerHTML=`<button class="btn g" id="bk">← Retour</button>${vis(c)}<h1>${H(c.n)}</h1><p style="line-height:1.5">${H(c.f)}</p><p class="mut">${c.w?`Source : <a target="_blank" rel="noopener" href="https://fr.wikipedia.org/wiki/${encodeURIComponent(c.w)}">Wikipédia</a> (texte et images : voir licences sur Wikimedia Commons).`:''}</p>`;hydrate();$('#bk').onclick=fiches})}
function settings(){A.innerHTML=`<h1>Paramètres</h1><div class="row"><span>Mode nuit</span><input type="checkbox" id="dk" ${S.dk?'checked':''}></div><h2>Thèmes actifs</h2>`+themes().map((t,i)=>`<div class="row"><span>${t.e||'📘'} ${H(t.n)}</span><span><input type="checkbox" data-t="${t.id}" ${S.off.includes(t.id)?'':'checked'}>${i>=D.length?` <button data-d="${t.id}">🗑</button>`:''}</span></div>`).join('')+
`<h2>Ajouter un thème</h2><p class="mut">1. Décris le thème, copie le texte et envoie-le à Claude dans la conversation. 2. Claude te renvoie un fichier .json. 3. Importe-le ici.</p><textarea id="tx" rows="3" placeholder="Ex : les champignons comestibles de France"></textarea><button class="btn g" id="cp">Copier la demande</button><input type="file" id="fi" accept=".json"><p id="msg" class="mut"></p><h2>Données</h2><button class="btn g" id="rs">Réinitialiser la progression</button>`;
$('#dk').onchange=e=>{S.dk=e.target.checked;save();view('set')};
A.querySelectorAll('[data-t]').forEach(i=>i.onchange=()=>{S.off=S.off.filter(x=>x!=i.dataset.t);if(!i.checked)S.off.push(i.dataset.t);save()});
A.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{S.x=S.x.filter(t=>t.id!=b.dataset.d);save();settings()});
$('#cp').onclick=()=>{const t=`Nouveau thème pour mon appli Carnet de terrain : ${$('#tx').value}. Génère 25 cartes au format JSON {"id":"...","n":"Titre","e":"emoji","c":[["Nom","Titre exact de la page Wikipédia FR","Phrase contenant exactement le nom"]]}, sources institutionnelles uniquement. Pose-moi tes questions si besoin.`;navigator.clipboard&&navigator.clipboard.writeText(t);$('#msg').textContent='Demande copiée. Colle-la dans la conversation avec Claude.'};
$('#fi').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.id||!j.n||!Array.isArray(j.c)||j.c.some(c=>!c[0]||!c[2]))throw 0;S.x=S.x.filter(t=>t.id!=j.id).concat(j);save();settings()}catch(x){$('#msg').textContent='Fichier invalide.'}};
$('#rs').onclick=()=>{if(confirm('Effacer toute la progression ?')){S.k={};save();settings()}}}
view('home');if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
