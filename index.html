.t b{display:block}.t small,.mut{color:var(--mut)}.e{font-size:30px}

.btn{display:block;width:100%;background:var(--pri);color:#fff;border:0;border-bottom:4px solid var(--pri2);border-radius:14px;padding:14px;font-size:17px;font-weight:700;margin:10px 0}
:root.dk .btn{color:#0f160d}.btn:disabled{opacity:.4}
.btn.g{background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:2px solid var(--line)}

.o{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;margin:8px 0;padding:10px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;color:var(--ink);font-size:16px;text-align:left}
.o.s{border-color:var(--pri);background:var(--bg)}.o.ok{border-color:var(--ok)}.o.ko{border-color:var(--ko)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .o{min-height:120px}

.pg{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 16px}.pg i{display:block;height:100%;background:var(--pri);transition:width .3s}
.bn{padding:12px;border-radius:12px;margin:8px 0;font-size:15px}.bn.ok{background:var(--ok);color:#fff}.bn.ko{background:var(--ko);color:#fff}
.q{font-size:20px;font-weight:700;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
textarea,input[type=file]{width:100%;padding:8px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px}a{color:var(--pri)}
